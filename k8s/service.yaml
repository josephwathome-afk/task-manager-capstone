apiVersion: v1
kind: Service
metadata:
  name: task-manager-service
  labels:
    app: task-manager
spec:
  type: NodePort
  selector:
    app: task-manager
  ports:
    - protocol: TCP
      port: 80          # cluster-internal port
      targetPort: 5000  # container port
      nodePort: 30080   # external port on every node (30000–32767)